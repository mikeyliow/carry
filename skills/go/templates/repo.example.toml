# .carry/repo.toml - this repo's carry settings. carry finds it from anywhere in the repo or its worktrees.
# Other repos reach this one by its name, e.g. a quest that uses api:export-csv.
# Placeholders: {port} {db} {wt} {log} {slug} {repo}, and {port:<repo>} for a repo this quest uses.

[repo]
name          = "{name}"
base          = "origin/main"
check         = "make verify"
lint          = "golangci-lint run"
seed          = "DATABASE_URL=postgres:///{db} make seed"
seed_after_up = "BASE=http://127.0.0.1:{port} ./scripts/seed-fixtures.sh"
run           = "PORT={port} DATABASE_URL=postgres:///{db} make run"
logs          = "tail -n 200 {log}"
review_port   = "8080"
# Optional: ui_driver = "script" (default, the .carry/ui harness) or "agent" (the agent drives its own browser tool). A quest can override it.
# Optional, for a repo with screens (setup writes .carry/ui/ from the template):
# ui = "rm -rf .carry/ui/scenarios && mkdir -p .carry/ui/scenarios && cp {scenarios}/*.spec.ts .carry/ui/scenarios/ 2>/dev/null; CARRY_UI_OUT={scenarios}/shots BASE_URL=http://127.0.0.1:{port} npx playwright test -c .carry/ui"
# '{scenarios}' is the verifier's scenarios folder; the builder runs the probe with the same command.
# Optional: hot_paths = ["src/billing/", "migrations/"] (a side quest naming one always gets a verifier spot-check)
# Written by the first PR: merge_methods = "squash" (what the forge allows, read once).
# Optional: db_prefix = "{name}" (sandbox database names start with it), rules = ".carry/rules.md" (another path for the rules file).

# A repo with no database leaves both empty.
[sandbox]
create = "createdb {db}"
drop   = "dropdb --if-exists {db}"
